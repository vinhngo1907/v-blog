version: '3.7'

services:
  node:
    container_name: node_server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    volumes:
      - ./server:/app
    command: yarn dev
    environment:
      PORT: 5000
      MONGO_URL: 'mongodb://mongo:27017/example'
      NODE_ENV: 'development'
    depends_on:
      - mongo
    networks:
      - common

  web:
    container_name: react_client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - 5001:5001
    volumes:
      - ./client:/app
    command: yarn dev
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - node
    networks:
      - common

  mongo:
    container_name: mongo
    image: mongo
    ports:
      - 27017:27017
    volumes:
      - ./data:/data/db
    networks:
      - common

networks:
  common: